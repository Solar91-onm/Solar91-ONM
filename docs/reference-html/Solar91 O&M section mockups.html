<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Solar91 O&M · section mockups</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#F4F6F5;--card:#fff;--fg:#111814;--mut:#69756F;--bd:#E4E9E6;--sub:#F2F5F3;--pri:#0c5e2a;--ok:#16A34A;--oks:#E7F6EC;--warn:#D97706;--warns:#FDF3E3;--bad:#DC4C3E;--bads:#FCEAE8;--info:#3B82F6;--infos:#EAF2FE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1512;--card:#17201B;--fg:#E8EFEA;--mut:#93A29A;--bd:#27322C;--sub:#1C2721;--oks:#12301D;--warns:#33250D;--bads:#3A1A16;--infos:#14253D;--pri:#2FA862}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:13.5px/1.45 "Inter","Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}.hide{display:none!important}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top h1{font-size:15px;margin:0 10px 0 0}.tab{border:1px solid var(--bd);background:var(--card);padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px}.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.page{max-width:1180px;margin:0 auto;padding:18px;display:grid;gap:14px}
.hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}.hd h2{margin:0;font-size:19px;letter-spacing:-.01em}.hd p{margin:2px 0 0;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--bd);background:var(--card);padding:7px 13px;border-radius:9px;font-weight:600;font-size:13px}.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.d{color:var(--bad)}.btn.sm{padding:4px 10px;font-size:12px}
.bell{position:relative}.bell b{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:11px 14px;text-align:left;border-left:4px solid var(--c,var(--bd))}.k.on{outline:2px solid var(--pri)}
.k span{display:block;font-size:12px;color:var(--mut)}.k b{font-size:22px;font-variant-numeric:tabular-nums}
.panel{border:1px solid var(--bd);background:var(--card);border-radius:14px;overflow:hidden}
.fb{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--bd);align-items:center}
.inp{border:1px solid var(--bd);background:var(--card);border-radius:9px;padding:7px 10px;min-width:120px}.inp.s{flex:1;min-width:180px}
.views{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}.vw{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600}.vw.on{background:var(--oks);border-color:var(--ok);color:var(--ok)}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:9px 12px;background:var(--pri);color:#fff}.bulk .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}.bulk a{color:#fff;text-decoration:underline;cursor:pointer}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:860px}th{text-align:left;font-size:12px;color:var(--mut);font-weight:650;padding:9px 12px;background:var(--sub);white-space:nowrap}td{padding:9px 12px;border-top:1px solid var(--bd);vertical-align:middle}tbody tr{cursor:pointer}tbody tr:hover td{background:var(--sub)}tr.sel td{background:var(--oks)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:650;background:var(--sub);color:var(--mut);white-space:nowrap}.chip.ok{background:var(--oks);color:var(--ok)}.chip.warn{background:var(--warns);color:var(--warn)}.chip.bad{background:var(--bads);color:var(--bad)}.chip.info{background:var(--infos);color:var(--info)}
.bar{display:flex;height:7px;border-radius:99px;background:var(--sub);overflow:hidden;min-width:90px}.bar i{height:100%}.o{background:var(--ok)}.p{background:repeating-linear-gradient(45deg,#8dc9a7,#8dc9a7 4px,#c4e3d1 4px,#c4e3d1 8px)}
.dots{display:flex;gap:4px}.dt{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--sub);color:var(--mut)}.dt.d{background:var(--oks);color:var(--ok)}.dt.c{background:var(--pri);color:#fff}
.pg{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:1px solid var(--bd);color:var(--mut);flex-wrap:wrap;gap:8px}
.grp td{background:var(--sub);font-weight:700;cursor:default;font-size:12.5px}.grp:hover td{background:var(--sub)!important}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:12px}.wd{border:1px solid var(--bd);border-radius:10px;padding:8px;min-height:130px;display:grid;gap:5px;align-content:start}.wd h5{margin:0;font-size:12px;color:var(--mut)}.wd.today{border-color:var(--pri);box-shadow:0 0 0 2px rgba(12,94,42,.14)}
.tk{font-size:11.5px;padding:4px 6px;border-radius:7px;background:var(--infos);border-left:3px solid var(--info)}.tk.od{background:var(--bads);border-color:var(--bad)}.tk.dn{background:var(--oks);border-color:var(--ok)}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(10,24,16,.4);z-index:40;display:flex;justify-content:flex-end}.dr{background:var(--card);width:min(520px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.25)}
.dh{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:10px}.dh h3{margin:0;font-size:16px}.dh p{margin:2px 0 0;color:var(--mut);font-size:12.5px}.x{border:0;background:none;font-size:22px;color:var(--mut)}
.db{padding:16px 20px;overflow:auto;flex:1;display:grid;gap:14px;align-content:start}.df{padding:12px 20px;border-top:1px solid var(--bd);background:var(--sub);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fl{display:grid;gap:4px}.fl span{font-size:12px;color:var(--mut)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{border:1px solid var(--bd);border-radius:12px;overflow:hidden}.sec h4{margin:0;padding:9px 12px;background:var(--sub);font-size:13px}
.ev{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:10px 12px;border-top:1px solid var(--bd);align-items:center}.ev b{font-weight:600}.ev small{display:block;color:var(--mut);font-size:12px}
.sw{width:38px;height:22px;border-radius:99px;background:var(--bd);border:0;position:relative;flex:none}.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:var(--ok)}.sw.on:after{left:19px}
.ch{display:flex;gap:5px;grid-column:1/-1}.cb{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:2px 10px;font-size:12px}.cb.on{background:var(--oks);border-color:var(--ok);color:var(--ok);font-weight:650}
.sg{display:flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden;width:max-content}.sg button{border:0;background:var(--card);padding:6px 14px;font-weight:600}.sg button.on{background:var(--pri);color:#fff}
@media(max-width:720px){.wk{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><h1>Solar91 O&amp;M · section mockups</h1>
<button class="tab on" data-t="pm">Preventive maintenance</button><button class="tab" data-t="wa">Washing · 70 plants</button><button class="tab" data-t="is">Site issues</button></div>
<div class="page" id="pg"></div><div id="ovl"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),E=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const chip=(t,c='')=>`<span class="chip ${c}">${t}</span>`;
/* ---------- notification settings (shared drawer) ---------- */
const NOTIF={
 is:{name:'Site issues',ev:[['New ticket raised','O&M Head','Instantly',1,[1,1]],['Ticket assigned to me','Assignee','Instantly',1,[1,1]],['Ticket not acknowledged','Assignee, then O&M Head','After 4 h, then 12 h',1,[1,0]],['Fix time (ETC) nearing','Assignee, O&M Head','24 h before, critical only',1,[1,0]],['Fix time missed','O&M Head, Administration','Instantly',1,[1,1]],['Resolved, waiting to verify','O&M Head','Instantly',1,[1,0]],['Ticket reopened','Assignee, O&M Head','Instantly',0,[1,0]]]},
 pm:{name:'Preventive maintenance',ev:[['Task due soon','Assignee','3 days before and on the day',1,[1,0]],['Task 1 day overdue','Assignee','Daily 09:00',1,[1,0]],['Task 3 days overdue','Site Engineer, Administration','Once',1,[1,1]],['Task 7 days overdue','O&M Head','Once',1,[1,1]],['Unit missed and moved forward','Assignee, O&M Head','With the daily job',1,[1,0]],['Completed with a problem found','O&M Head','Instantly',1,[1,1]],['Weekly plan summary','O&M Head','Monday 08:00',0,[0,1]]]},
 wa:{name:'Washing',ev:[['Report waiting for confirmation','O&M Head','Instantly, or hourly digest',1,[1,0]],['Report rejected','Site Engineer who reported','Instantly',1,[1,0]],['Cycle completed, next cycle started','O&M Head, Assignee','Instantly',1,[1,0]],['Plant 1+ day late','Assignee','Once',1,[1,0]],['Plant 3+ days late','O&M Head','Once',1,[1,1]],['Plant 7+ days late','O&M Head, Administration','Once',1,[1,1]],['Weekly compliance below target','O&M Head','Every Monday',1,[0,1]]]}};
function notifDrawer(m){const n=NOTIF[m];let mode='mine';
 const body=()=>`<div class="sg"><button class="${mode=='mine'?'on':''}" data-m="mine">My alerts</button><button class="${mode=='rules'?'on':''}" data-m="rules">Team rules · O&amp;M Head</button></div>
 ${mode=='mine'?`<div class="sec"><h4>How I want to be told</h4><div class="ev"><div><b>Delivery</b><small>Bundle non-urgent alerts into one email</small></div><div class="sg"><button class="on">Instant</button><button>Hourly</button><button>Daily</button></div><div><b>Quiet hours</b><small>Only critical alerts break through</small></div><div class="row"><input class="inp" value="21:00" style="min-width:70px;width:78px"><input class="inp" value="06:00" style="min-width:70px;width:78px"></div></div></div>`:`<div class="row">${chip('Applies to all plants','info')}<select class="inp"><option>All plants</option><option>Only Rajasthan</option></select></div>`}
 <div class="sec"><h4>${n.name} events</h4>${n.ev.map((e,i)=>`<div class="ev"><div><b>${e[0]}</b><small>${mode=='rules'?'To: '+e[1]+' · '+e[2]:e[2]}</small></div><button class="sw ${e[3]?'on':''}" aria-label="Toggle"></button><div class="ch"><button class="cb ${e[4][0]?'on':''}">In-app</button><button class="cb ${e[4][1]?'on':''}">Email</button>${mode=='rules'?'<button class="cb">Edit recipients</button>':''}</div></div>`).join('')}</div>`;
 const o=E(`<div class="ov"><div class="dr"><div class="dh"><div><h3>Notification settings</h3><p>${n.name} · changes apply to ${'<b>you</b>'} unless set as a team rule</p></div><button class="x">×</button></div><div class="db"></div><div class="df"><button class="btn">Send me a test</button><button class="btn p">Save settings</button></div></div></div>`);
 const paint=()=>{$('.db',o).innerHTML=body();o.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;paint()});o.querySelectorAll('.sw,.cb').forEach(b=>b.onclick=()=>b.classList.toggle('on'))};
 paint();o.onclick=e=>{if(e.target===o||e.target.classList.contains('x')||e.target.classList.contains('btn'))o.remove()};$('#ovl').append(o)}
const bell=(m,c)=>`<button class="btn bell" onclick="notifDrawer('${m}')">🔔 Notifications<b>${c}</b></button>`;
/* ---------- PM ---------- */
const PM=[['Inverter','Thermography and torque check','SP-014 Bhadla','Ravi Meena','Monthly',[1,1,1,1,1,2,3,0,0,0,0,0],'Due today','warn'],['Inverter','Thermography and torque check','SP-021 Jodhpur','Ravi Meena','Monthly',[1,1,1,1,0,0,0,0],'Due in 2 days','info'],['Transformer','Oil level and BDV test','SP-014 Bhadla','Anil Kumar','Quarterly',[1,0,0,0],'Overdue 3 days','bad'],['Transformer','Oil level and BDV test','SP-009 Phalodi','Anil Kumar','Quarterly',[1,1,1,0],'Due in 5 days','info'],['VCB Panel','Contact and trip test','SP-014 Bhadla','Mohan Lal','Half-yearly',[1],'Overdue 1 day','bad'],['Earthing','Pit resistance check','SP-033 Pokaran','Sunil Jat','Yearly',[1,1,1,1,1,1],'Completed','ok'],['Inverter','Thermography and torque check','SP-033 Pokaran','Sunil Jat','Monthly',[1,1,1,1,1,1],'Completed','ok']];
function pm(){const t=E(`<div class="page2" style="display:grid;gap:14px"><div class="hd"><div><h2>Preventive maintenance</h2><p>Planned work, one task per unit. 70 plants · 412 open tasks</p></div><div class="row">${bell('pm',3)}<button class="btn">Unit configuration</button><button class="btn">Import plan</button><button class="btn p">+ Add task</button></div></div>
 <div class="kp"><button class="k" style="--c:var(--warn)"><span>Due today</span><b>18</b></button><button class="k" style="--c:var(--bad)"><span>Overdue</span><b>9</b></button><button class="k" style="--c:var(--info)"><span>Next 7 days</span><b>64</b></button><button class="k" style="--c:var(--ok)"><span>Done this month</span><b>131</b></button><button class="k"><span>On-time rate</span><b>94%</b></button></div>
 <div class="panel"><div class="views"><button class="vw on">All</button><button class="vw">Mine</button><button class="vw">Overdue</button><button class="vw">Needs photos</button><button class="vw">+ Save view</button><span style="flex:1"></span><div class="sg"><button class="on" id="vl">List</button><button id="vk">Week</button></div></div>
 <div class="fb"><input class="inp s" placeholder="Search task, plant or equipment"><select class="inp"><option>All plants</option></select><select class="inp"><option>All equipment</option><option>Inverter</option></select><select class="inp"><option>All assignees</option></select><select class="inp"><option>Any status</option></select></div>
 <div id="pmb"></div></div></div>`);
 const list=()=>{let last='';return `<div class="tw"><table><thead><tr><th>Task</th><th>Plant</th><th>Assignee</th><th>Cycle units</th><th>Frequency</th><th>Status</th><th></th></tr></thead><tbody>${PM.map(r=>{const done=r[5].filter(x=>x==1).length;const g=r[0]!=last?`<tr class="grp"><td colspan="7">${r[0]}</td></tr>`:'';last=r[0];return g+`<tr><td><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]}</td><td><div class="row" style="gap:8px"><div class="bar" style="width:100px"><i class="o" style="width:${100*done/r[5].length}%"></i></div><small>${done}/${r[5].length}</small></div></td><td>${r[4]}</td><td>${chip(r[6],r[7])}</td><td><button class="btn sm">Open</button></td></tr>`}).join('')}</tbody></table></div><div class="pg"><span>Showing 7 of 412</span><span class="row"><button class="btn sm">‹</button><button class="btn sm">1</button><button class="btn sm">2</button><button class="btn sm">›</button></span></div>`};
 const week=()=>`<div class="wk">${['Mon 5','Tue 6','Wed 7','Thu 8','Fri 9','Sat 10','Sun 11'].map((d,i)=>`<div class="wd ${i==4?'today':''}"><h5>${d}${i==4?' · today':''}</h5>${[['INV 7 · Bhadla','dn'],['TR 2 · Phalodi','od'],['INV 8 · Bhadla',''],['VCB · Jodhpur','']].slice(0,(i*3+1)%4+1).map((x,j)=>`<div class="tk ${i<4&&j==0?'dn':x[1]}">${x[0]}</div>`).join('')}</div>`).join('')}</div>`;
 const set=v=>{$('#pmb',t).innerHTML=v?list():week();$('#vl',t).classList.toggle('on',v);$('#vk',t).classList.toggle('on',!v)};
 $('#vl',t).onclick=()=>set(1);$('#vk',t).onclick=()=>set(0);set(1);return t}
/* ---------- Washing, 70 plants ---------- */
const NM=['Bhadla','Jodhpur','Phalodi','Pokaran','Osian','Bikaner','Jaisalmer','Nokha','Fatehgarh','Barmer'],AS=['Mohan Lal','Sunil Jat','Ravi Meena','Anil Kumar',null];
const WP=Array.from({length:70},(_,i)=>{const late=[0,0,0,0,1,3,7,0][i*7%8],cyc=1+(i%3),pr=(i*37)%100;return{id:i,code:'SP-'+String(i+1).padStart(3,'0'),name:NM[i%10]+' '+(Math.floor(i/10)+1),tables:600+(i*53)%900,asg:i%11==0?null:AS[i%4],late,cyc,prog:pr,wait:(i*13)%5==0?(i%4+1)*9:0,wk:60+(i*17)%41,setup:i%17!=0,today:['Reported','Reported','Not done','No report'][i%4],reg:['North','West','South'][i%3]}});
const W={q:'',view:'all',late:'all',asg:'all',sel:new Set(),pg:1,sort:'late'};
function wf(){return WP.filter(p=>(W.q?(p.name+p.code).toLowerCase().includes(W.q):1)&&(W.asg=='all'||(W.asg=='none'?!p.asg:p.asg==W.asg))&&(W.late=='all'||(W.late=='0'?p.late==0:p.late>=+W.late))&&(W.view=='all'||(W.view=='wait'?p.wait:W.view=='setup'?!p.setup:W.view=='low'?p.wk<85:1))).sort((a,b)=>W.sort=='late'?b.late-a.late:a.name.localeCompare(b.name))}
function wa(){const t=E(`<div style="display:grid;gap:14px"><div class="hd"><div><h2>Plant washing</h2><p>Find any plant in two taps, act on many at once</p></div><div class="row">${bell('wa',5)}<button class="btn">Export</button><button class="btn">Bulk upload setup</button></div></div><div class="kp" id="wk"></div><div class="panel" id="wp"></div></div>`);
 const draw=()=>{const L=wf(),per=12,pages=Math.max(1,Math.ceil(L.length/per)),rows=L.slice((W.pg-1)*per,W.pg*per);if(W.pg>pages)W.pg=1;
  const cnt=f=>WP.filter(f).length;
  $('#wk',t).innerHTML=[['all','Late filter off',70,'','var(--bd)'],['0','On track',cnt(p=>!p.late),'0','var(--ok)'],['1','1+ day late',cnt(p=>p.late>=1),'1','var(--warn)'],['3','3+ days late',cnt(p=>p.late>=3),'3','var(--bad)'],['7','7+ days late',cnt(p=>p.late>=7),'7','#8b1d12']].map(k=>`<button class="k ${W.late==k[3]||(W.late=='all'&&k[0]=='all')?'on':''}" style="--c:${k[4]}" data-l="${k[3]||'all'}"><span>${k[0]=='all'?'All plants':k[1]}</span><b>${k[2]}</b></button>`).join('');
  $('#wp',t).innerHTML=`<div class="views">${[['all','All plants'],['wait','Waiting confirmation'],['low','Below weekly target'],['setup','Not set up']].map(v=>`<button class="vw ${W.view==v[0]?'on':''}" data-v="${v[0]}">${v[1]}</button>`).join('')}</div>
  <div class="fb"><input class="inp s" id="wq" placeholder="Search 70 plants by name or code" value="${W.q}"><select class="inp" id="wsa"><option value="all">All assignees</option><option value="none" ${W.asg=='none'?'selected':''}>Unassigned</option>${AS.filter(Boolean).map(a=>`<option ${W.asg==a?'selected':''}>${a}</option>`).join('')}</select><select class="inp"><option>All regions</option><option>North</option><option>West</option><option>South</option></select><select class="inp" id="wso"><option value="late">Most late first</option><option value="name" ${W.sort=='name'?'selected':''}>Name A–Z</option></select>${W.late!='all'||W.view!='all'||W.asg!='all'||W.q?'<button class="btn sm" id="wc">Clear filters</button>':''}</div>
  ${W.sel.size?`<div class="bulk"><b>${W.sel.size} selected</b>${W.sel.size<L.length?`<a id="wall">Select all ${L.length} matching</a>`:''}<span style="flex:1"></span><button class="btn sm">Assign person</button><button class="btn sm">Set weekly target</button><button class="btn sm">Send reminder</button><button class="btn sm">Edit settings</button><button class="btn sm" id="wno">✕</button></div>`:''}
  <div class="tw"><table><thead><tr><th style="width:34px"><input type="checkbox" id="wsa2" ${rows.length&&rows.every(r=>W.sel.has(r.id))?'checked':''}></th><th>Plant</th><th>Cycle progress</th><th>Cycles</th><th>Today</th><th>Weekly</th><th>Status</th><th>Assignee</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr class="${W.sel.has(p.id)?'sel':''}" data-id="${p.id}"><td><input type="checkbox" data-s="${p.id}" ${W.sel.has(p.id)?'checked':''}></td><td><b>${p.name}</b><br><small style="color:var(--mut)">${p.code} · ${p.tables} tables</small></td><td>${p.setup?`<div class="row" style="gap:8px"><div class="bar"><i class="o" style="width:${p.prog*.85}%"></i><i class="p" style="width:${p.wait?10:0}%"></i></div><small>${p.prog}%</small></div>`:chip('Not set up')}</td><td>${p.setup?`<div class="dots">${[1,2,3].map(c=>`<span class="dt ${c<p.cyc?'d':c==p.cyc?'c':''}">${c}</span>`).join('')}</div>`:'—'}</td><td>${p.setup?chip(p.today,p.today=='Reported'?'ok':p.today=='Not done'?'warn':'')+(p.wait?' '+chip(p.wait+' waiting','info'):''):'—'}</td><td>${p.setup?chip(p.wk+'%',p.wk>=85?'ok':p.wk>=70?'warn':'bad'):'—'}</td><td>${p.late?chip(p.late+' d late',p.late>=7?'bad':p.late>=3?'bad':'warn'):chip('On track','ok')}</td><td>${p.asg||'<span style="color:var(--bad);font-weight:650">Unassigned</span>'}</td><td><button class="btn sm" data-e="${p.id}">Edit</button></td></tr>`).join('')||'<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--mut)">No plants match. Clear a filter to see more.</td></tr>'}</tbody></table></div>
  <div class="pg"><span>${L.length?(W.pg-1)*per+1:0}–${Math.min(W.pg*per,L.length)} of ${L.length} plants</span><span class="row"><button class="btn sm" data-p="-1">‹ Prev</button><span>Page ${W.pg} of ${pages}</span><button class="btn sm" data-p="1">Next ›</button></span></div>`;
  $('#wk',t).querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{W.late=b.dataset.l;W.pg=1;draw()});
  t.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{W.view=b.dataset.v;W.pg=1;draw()});
  const q=$('#wq',t);q.oninput=()=>{W.q=q.value.toLowerCase();W.pg=1;const pos=q.selectionStart;draw();const n=$('#wq',t);n.focus();n.setSelectionRange(pos,pos)};
  $('#wsa',t).onchange=e=>{W.asg=e.target.value;W.pg=1;draw()};$('#wso',t).onchange=e=>{W.sort=e.target.value;draw()};
  const c=$('#wc',t);if(c)c.onclick=()=>{Object.assign(W,{q:'',view:'all',late:'all',asg:'all',pg:1});draw()};
  t.querySelectorAll('[data-s]').forEach(b=>b.onclick=e=>{e.stopPropagation();b.checked?W.sel.add(+b.dataset.s):W.sel.delete(+b.dataset.s);draw()});
  $('#wsa2',t).onchange=e=>{rows.forEach(r=>e.target.checked?W.sel.add(r.id):W.sel.delete(r.id));draw()};
  const a=$('#wall',t);if(a)a.onclick=()=>{L.forEach(r=>W.sel.add(r.id));draw()};const n=$('#wno',t);if(n)n.onclick=()=>{W.sel.clear();draw()};
  t.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{W.pg=Math.min(pages,Math.max(1,W.pg+ +b.dataset.p));draw()});
  t.querySelectorAll('[data-e]').forEach(b=>b.onclick=e=>{e.stopPropagation();edit(WP[+b.dataset.e])});
  t.querySelectorAll('tbody tr[data-id]').forEach(r=>r.onclick=()=>edit(WP[+r.dataset.id]))};
 draw();return t}
function edit(p){const o=E(`<div class="ov"><div class="dr"><div class="dh"><div><h3>${p.name} <small style="color:var(--mut);font-weight:500">${p.code}</small></h3><p>Edit washing setup · ${p.tables} tables</p></div><button class="x">×</button></div><div class="db"><div class="fl"><span>Washing assignee</span><select class="inp">${AS.filter(Boolean).map(a=>`<option ${a==p.asg?'selected':''}>${a}</option>`).join('')}<option ${p.asg?'':'selected'}>Choose a person</option></select></div><div class="g2"><div class="fl"><span>Number of tables</span><input class="inp" type="number" value="${p.tables}"></div><div class="fl"><span>Weekly target %</span><input class="inp" type="number" value="85"></div></div><div class="g2"><div class="fl"><span>Cycle 1 deadline</span><input class="inp" value="10th"></div><div class="fl"><span>Cycle 2 deadline</span><input class="inp" value="20th"></div></div><div class="sec"><h4>Alerts for this plant</h4><div class="ev"><div><b>Late alerts (1, 3 and 7 days)</b><small>Uses the team rule unless you change it</small></div><button class="sw on"></button><div><b>Remind site engineer daily at 16:00</b><small>If no report by then</small></div><button class="sw"></button></div></div><div class="fl"><span>Apply these changes to</span><div class="sg"><button class="on">This plant</button><button>${W.sel.size||'0'} selected</button><button>All 70</button></div></div></div><div class="df"><button class="btn">Cancel</button><button class="btn p">Save changes</button></div></div></div>`);
 o.onclick=e=>{if(e.target===o||e.target.classList.contains('x')||e.target.classList.contains('btn'))o.remove()};o.querySelectorAll('.sw').forEach(b=>b.onclick=()=>b.classList.toggle('on'));o.querySelectorAll('.sg button').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});$('#ovl').append(o)}
/* ---------- Site issues (list + settings) ---------- */
function is(){const R=[['ISS-0142','Inverter · String fault','SP-014 Bhadla','Critical','In progress','Ravi Meena','ETC in 5 h','warn'],['ISS-0141','Transformer · Oil leak','SP-009 Phalodi','High','Assigned','Anil Kumar','On time','ok'],['ISS-0139','CCTV · Camera offline','SP-021 Jodhpur','Medium','Open','—','Not assigned','bad'],['ISS-0136','VCB · Trip alarm','SP-033 Pokaran','Critical','Resolved','Mohan Lal','Verify now','info']];
 return E(`<div style="display:grid;gap:14px"><div class="hd"><div><h2>Site issues</h2><p>Unplanned faults and urgent requests</p></div><div class="row">${bell('is',4)}<button class="btn p">+ Raise issue</button></div></div><div class="panel"><div class="tw"><table><thead><tr><th>Ticket</th><th>Issue</th><th>Plant</th><th>Priority</th><th>Status</th><th>Assignee</th><th>Fix time</th></tr></thead><tbody>${R.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${chip(r[3],r[3]=='Critical'?'bad':r[3]=='High'?'warn':'')}</td><td>${chip(r[4],'info')}</td><td>${r[5]}</td><td>${chip(r[6],r[7])}</td></tr>`).join('')}</tbody></table></div></div><p style="color:var(--mut)">The ticket overlay is in the earlier sample. Press Notifications to see the issue alert settings.</p></div>`)}
const V={pm,wa,is};function show(k){$('#pg').replaceChildren(V[k]());document.querySelectorAll('.top .tab').forEach(b=>b.classList.toggle('on',b.dataset.t==k))}
document.querySelectorAll('.top .tab').forEach(b=>b.onclick=()=>show(b.dataset.t));show('pm');
</script></body></html>
