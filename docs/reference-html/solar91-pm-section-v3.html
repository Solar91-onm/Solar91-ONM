<script>
const $=s=>document.querySelector(s),MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],BASE=new Date(2026,9,9);

 if(o<0){if(r<6){t.doneOn=o-(r%3)+(r==5?3:0);t.st='Done'}else{t.st='Overdue';if(k==1)t.ch=[{d:-1,by:'Anil Kumar',how:'Called',who:'Site engineer',out:'Will finish by '+fmt(2),promise:2,note:''}];if(k==2)t.ch=[{d:-4,by:'Ravi Meena',how:'Messaged',who:'Site engineer',out:'Will finish by '+fmt(-1),promise:-1,note:''}];if(k==3)t.ch=[{d:-2,by:'Anil Kumar',how:'Called',who:'Site engineer',out:'Blocked: waiting for shutdown',promise:4,note:'Grid shutdown booked'}]}}

 <div class="cd"><h4>Edit job</h4><div class="f2"><div class="fd"><span>Assignee</span><select class="inp" id="ea">${AS.map(a=>`<option ${a==t.as?'selected':''}>${a}</option>`).join('')}</select></div><div class="fd"><span>Due date</span><input class="inp" type="date" id="ed2" value="${iso(t.due)}"></div><div class="fd"><span>Frequency</span><select class="inp" id="ef">${['Monthly','Quarterly','Half-yearly','Yearly'].map(f=>`<option ${f==t.freq?'selected':''}>${f}</option>`).join('')}</select></div><div class="fd"><span>Quantity at this plant</span><input class="inp" type="number" id="eqn" value="${t.qty}"></div></div><div class="fd" id="rsn" style="margin-top:10px;display:none"><span>Why is the due date moving? (needed for an overdue job)</span><input class="inp" placeholder="Reason"></div></div>
 ${t.st!='Done'?`<div class="cd"><h4>Who gets told</h4><div class="lad">${lad.map(l=>`<div class="ls ${t.due<=-l[0]?'r'+(l[0]<=0?' g':''):''}"><i></i><span>${l[1]}</span></div>`).join('')}</div></div>`:''}
 ${t.st!='Done'?`<div class="cd"><h4>Follow-ups with the site</h4>${t.ch.map(c=>`<div class="fu"><b>${c.how} ${c.who.toLowerCase()}</b> · ${c.out}<small>${c.by} · ${fmt(c.d)}${c.note?' · '+c.note:''}</small></div>`).join('')||'<p style="color:var(--mut);margin:0 0 8px">No follow-up yet.</p>'}
 <div class="f2" style="margin-top:8px"><div class="fd"><span>How</span><select class="inp" id="fh"><option>Called</option><option>Messaged</option><option>Visited</option></select></div><div class="fd"><span>What did they say?</span><select class="inp" id="fo"><option>Will finish by the promised date</option><option>Blocked: waiting for shutdown</option><option>Blocked: waiting for parts</option><option>Blocked: no access</option><option>Could not reach anyone</option></select></div><div class="fd"><span>Promised date</span><input class="inp" type="date" id="fp" value="${iso(2)}"></div><div class="fd"><span>Note</span><input class="inp" id="fn" placeholder="Optional"></div></div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><a class="btn sm" href="tel:+910000000000">Call site</a><a class="btn sm" href="sms:+910000000000">Message site</a><button class="btn sm p" id="fs">Save follow-up</button></div></div>`:''}
 ${t.st!='Done'?`<div class="cd"><h4>Mark as done</h4><p style="margin:0 0 8px;color:var(--mut)">Both photos are needed. This closes the job for ${e[0]} at ${p.name}.</p><div class="f2"><button class="btn" id="pb">Add before photo</button><button class="btn" id="pa">Add after photo</button></div><div class="fd" style="margin-top:10px"><span>Remark</span><input class="inp" id="rm" placeholder="What was done"></div><button class="btn p" id="dn" style="margin-top:10px" disabled>Complete job</button></div>`:`<div class="cd"><h4>Completed</h4><p style="margin:0">Done on ${fmt(t.doneOn)} ${t.doneOn>t.due?'(late)':'(on time)'}. Next due date is set from this.</p></div>`}
 </div><div class="df"><button class="btn" data-close="1">Cancel</button><button class="btn p" id="sv">Save changes</button></div></div></div>`);close(o);
 const q=s=>o.querySelector(s);
 q('#ed2').onchange=()=>{q('#rsn').style.display=(t.st=='Overdue'&&off(q('#ed2').value)>t.due)?'grid':'none'};
 q('#sv').onclick=()=>{t.as=q('#ea').value;t.freq=q('#ef').value;t.qty=+q('#eqn').value||t.qty;mv(t,off(q('#ed2').value));o.remove();draw()};
 if(q('#fs'))q('#fs').onclick=()=>{const out=q('#fo').value,pr=q('#fp').value,blk=out.startsWith('Blocked')||!out.startsWith('Will');t.ch.push({d:0,by:S.role=='head'?'O&M Head':ME,how:q('#fh').value,who:'Site engineer',out:out.startsWith('Will')?'Will finish by '+fmt(off(pr)):out,promise:out.startsWith('Could')?null:off(pr),note:q('#fn').value});o.remove();draw();toast('Follow-up saved')};
 if(q('#dn')){const chk=()=>{q('#dn').disabled=!(pa&&pb)};q('#pb').onclick=()=>{pb=1;q('#pb').textContent='Before photo added';chk()};q('#pa').onclick=()=>{pa=1;q('#pa').textContent='After photo added';chk()};q('#dn').onclick=()=>{t.st='Done';t.doneOn=0;o.remove();draw();toast('Job completed')}}}
$('#bell').onclick=()=>{const ev=[['Job due soon','Assignee, 3 days before',1,1,0],['Job due today','Assignee',1,1,0],['Job 1 day late','Assignee and O&M Head',1,1,1],['Job 3 days late','Assignee and O&M Head, again',1,1,1],['Job 7 days late','O&M Head, marked critical',1,1,1],['Site promised a date and missed it','Assignee and O&M Head',1,1,1],['No follow-up for 2 days on a late job','Assignee',1,1,0],['Weekly summary of late jobs','O&M Head, Monday 08:00',0,0,1]];
 const o=mk(`<div class="ov"><div class="dr"><div class="dh"><div><h3>Alerts for preventive maintenance</h3><p>Choose what you hear about and how</p></div><button class="x">×</button></div><div class="db"><div class="cd" style="padding:0 12px">${ev.map(e=>`<div class="ev"><div><b>${e[0]}</b><small>${e[1]}</small></div><button class="sw ${e[2]?'on':''}"></button><div style="display:flex;gap:5px;grid-column:1/-1"><button class="cb ${e[3]?'on':''}">In-app</button><button class="cb ${e[4]?'on':''}">Email</button></div></div>`).join('')}</div></div><div class="df"><button class="btn" data-close="1">Cancel</button><button class="btn p" data-close="1">Save</button></div></div></div>`);
 o.querySelectorAll('.sw,.cb').forEach(b=>b.onclick=()=>b.classList.toggle('on'));close(o)};
setP('all');
</script></body></html>
