<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<!-- installed on a phone home screen: full screen, Solar91 name and icon -->
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Solar91 O&amp;M"/>
<meta name="application-name" content="Solar91 O&amp;M"/>
<meta name="format-detection" content="telephone=no"/>
<!-- Asset URLs get ?v=<content hash> automatically when the page is served (app/core/assets.py). -->
<meta name="s91-build" content="{{ build_id }}"/>
<title>Solar91 - O&amp;M Intelligence Centre</title>
<meta name="description" content="Solar91 O&amp;M portal — portfolio-wide operational view with per-plant drill-down."/>
<link rel="icon" type="image/svg+xml" href="/assets/images/solar91-mark.svg"/>

<!-- This is a sign-in-gated operations portal, not a public website. Every page needs an account,
     so there is nothing for a search engine to index; listing it would only advertise the login.
     robots.txt says the same thing (app/main.py). Remove both to allow indexing. -->
<meta name="robots" content="noindex, nofollow"/>
<link rel="canonical" href="{{ public_url }}/"/>

<!-- How the link looks when it is pasted into WhatsApp, Slack or an e-mail. Without these the
     preview falls back to a bare URL, which reads like an untrusted link to the people invited. -->
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="Solar91 O&amp;M"/>
<meta property="og:title" content="Solar91 — O&amp;M Intelligence Centre"/>
<meta property="og:description" content="Sign in to the Solar91 operations portal: plants, site issues, preventive maintenance, module cleaning and evidence."/>
<meta property="og:url" content="{{ public_url }}/"/>
<meta property="og:image" content="{{ public_url }}/static/pwa/icon-512.png"/>
<meta property="og:image:width" content="512"/>
<meta property="og:image:height" content="512"/>
<meta name="twitter:card" content="summary"/>
<meta name="twitter:title" content="Solar91 — O&amp;M Intelligence Centre"/>
<meta name="twitter:description" content="Sign in to the Solar91 operations portal."/>
<meta name="twitter:image" content="{{ public_url }}/static/pwa/icon-512.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"/>

<!-- The sign-in panel keeps its own stylesheet, unchanged. -->
<link rel="stylesheet" href="/static/css/login.css"/>

<!-- Portal design system -->
<link rel="stylesheet" href="/assets/css/tokens.css"/>
<link rel="stylesheet" href="/assets/css/layout.css"/>
<link rel="stylesheet" href="/assets/css/components.css"/>
<link rel="stylesheet" href="/assets/css/calendar.css"/>
<link rel="stylesheet" href="/assets/css/settings.css"/>
<link rel="stylesheet" href="/assets/css/site-issues.css"/>
<link rel="stylesheet" href="/assets/css/plant-details.css"/>
<link rel="stylesheet" href="/assets/css/asset-warranty.css"/>

<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="theme-color" content="#005e09"/>
<link rel="icon" type="image/png" sizes="32x32" href="/static/pwa/favicon-32.png"/>
<link rel="apple-touch-icon" href="/static/pwa/apple-touch-icon.png"/>
</head>
<body>
<!-- #app is the mount point the sign-in panel replaces. The portal shell lives inside it. -->
<div id="app">
  <div class="ep-shell">
    <!-- ─────────────────── Sidebar ─────────────────── -->
    <aside class="ep-sidebar" aria-label="Primary navigation">
      <div class="ep-sidebar__brand">
        <img src="/assets/images/solar91-mark.svg" alt="" />
        <span>Solar91</span>
      </div>

      <div class="ep-sidebar__scroll">
        <!-- Overview — simple top-level nav item -->
        <button class="ep-nav-item ep-nav-item--top" type="button" data-nav="overview">
          <svg class="ep-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
            <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
            <rect x="3" y="16" width="7" height="5" rx="1.5"></rect>
          </svg>
          <span class="ep-nav-item__label">Overview</span>
        </button>
        <!-- Plants — expandable group -->
        <div class="ep-nav-group" data-nav-group="plants">
          <button class="ep-nav-group__toggle" type="button">
            <svg class="ep-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v6"></path>
              <path d="M5 10h14l-2 11H7L5 10z"></path>
              <path d="M9 10a3 3 0 0 1 6 0"></path>
            </svg>
            <span class="ep-nav-item__label">Plants</span>
            <svg class="ep-nav-group__chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>
          <div class="ep-nav-group__body">
            <div class="ep-nav-group__search">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto; color:var(--ep-text-faint);">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.5-3.5"></path>
              </svg>
              <input type="text" placeholder="Search plants..." data-plant-search autocomplete="off" />
            </div>
            <div class="ep-nav-group__list" data-plant-nav-list>
              <!-- Populated by JS from plant catalog -->
            </div>
          </div>
        </div>

        <!-- Views — expandable group -->
        <div class="ep-nav-group" data-nav-group="views">
          <button class="ep-nav-group__toggle" type="button">
            <svg class="ep-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span class="ep-nav-item__label">Views</span>
            <svg class="ep-nav-group__chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>
          <div class="ep-nav-group__body">
            <button class="ep-nav-item ep-nav-item--sub" type="button" data-nav="view:details">
              <span class="ep-nav-item__label">Details</span>
            </button>
            <div class="ep-nav-detail-sub">
              <button class="ep-nav-item ep-nav-item--sub ep-nav-item--detail" type="button" data-nav="view:details:design-mdl">
                <span class="ep-nav-item__label">Design/MDL</span>
              </button>
              <button class="ep-nav-item ep-nav-item--sub ep-nav-item--detail" type="button" data-nav="view:details:purchase">
                <span class="ep-nav-item__label">Purchase</span>
              </button>
              <button class="ep-nav-item ep-nav-item--sub ep-nav-item--detail" type="button" data-nav="view:details:liasoning">
                <span class="ep-nav-item__label">Liasoning</span>
              </button>
              <button class="ep-nav-item ep-nav-item--sub ep-nav-item--detail" type="button" data-nav="view:details:bom">
                <span class="ep-nav-item__label">BOM</span>
              </button>
            </div>
            <button class="ep-nav-item ep-nav-item--sub" type="button" data-nav="view:health">
              <span class="ep-nav-item__label">Health</span>
            </button>
            <button class="ep-nav-item ep-nav-item--sub" type="button" data-nav="view:pm">
              <span class="ep-nav-item__label">Preventive Maintenance</span>
            </button>
            <button class="ep-nav-item ep-nav-item--sub" type="button" data-nav="view:washing">
              <span class="ep-nav-item__label">Module Cleaning</span>
            </button>
            <button class="ep-nav-item ep-nav-item--sub" type="button" data-nav="view:asset-warranty">
              <span class="ep-nav-item__label">Asset &amp; Warranty</span>
            </button>
            <button class="ep-nav-item ep-nav-item--sub" type="button" data-nav="view:movable-assets">
  <span class="ep-nav-item__label">Movable Assets</span>
</button>
          </div>
        </div>
      </div>

      <div class="ep-sidebar__settings">
        <button class="ep-nav-item" type="button" data-nav="settings">
          <svg class="ep-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2Z" transform="translate(-1 -1)"></path>
          </svg>
          <span class="ep-nav-item__label">Login access</span>
        </button>
      </div>

      <div class="ep-sidebar__footer">
        <div class="ep-avatar" aria-hidden="true">S</div>
        <div class="ep-user">
          <div class="ep-user__name" data-user-name>Solar91 Team</div>
          <div class="ep-user__role" data-user-role>Role</div>
        </div>
      </div>
    </aside>

    <!-- ─────────────────── Main ─────────────────── -->
    <main class="ep-main">
      <div class="ep-topbar">
        <div class="ep-topbar__inner">
          <button class="ep-icon-btn" type="button" data-sidebar-toggle aria-label="Collapse sidebar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <path d="M9 3v18"></path>
            </svg>
          </button>
          <div class="ep-topbar__title" data-topbar-title>Overview</div>
          <div class="ep-topbar__spacer"></div>
          <div class="ep-topbar__meta">
            <span class="ep-badge-live" title="Every figure on this page is read from the Solar91 database.">Live data</span>
            <span data-last-updated>Updated —</span>
          </div>
        </div>
      </div>

      <div class="ep-page">
        <div class="ep-page__inner">

          <!-- ═════════════ OVERVIEW ═════════════ -->
          <section class="ep-tab-view" data-tab-view="overview" aria-labelledby="overview-title">
            <!-- Thin header strip — title on the left, capacity chips on the right -->
            <div class="ep-headstrip">
              <span class="ep-headstrip__title" id="overview-title">Portfolio Overview <em data-portfolio-headline>· All plants</em></span>
              <span class="ep-headstrip__spacer"></span>
              <span class="ep-chip-stat"><span class="ep-chip-stat__k">DC</span><span class="ep-chip-stat__v" data-cap-dc>—</span></span>
              <span class="ep-chip-stat"><span class="ep-chip-stat__k">AC</span><span class="ep-chip-stat__v" data-cap-ac>—</span></span>
            </div>

            <!-- Filter bar -->
            <div class="ep-filterbar" role="group" aria-label="Portfolio filters">
              <div class="ep-filter ep-filter--combo" data-plant-filter-combo>
                <span class="ep-filter__label">Plant</span>
                <div class="ep-filter-combo">
                  <input type="text" class="ep-filter-combo__input" placeholder="All plants" data-plant-filter-input autocomplete="off" aria-label="Search and filter by plant" />
                  <svg class="ep-filter-combo__chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
                  <div class="ep-filter-combo__panel" data-plant-filter-panel></div>
                </div>
              </div>
              <label class="ep-filter">
                <span class="ep-filter__label">Health</span>
                <select class="ep-filter__select" data-filter="health" aria-label="Filter by plant condition">
                  <option value="__all">All conditions</option>
                  <option value="healthy">Healthy only</option>
                  <option value="attention">Attention required</option>
                  <option value="critical">Critical</option>
                  <option value="unknown">Not available</option>
                </select>
              </label>
              <label class="ep-filter">
                <span class="ep-filter__label">SPV</span>
                <select class="ep-filter__select" data-filter="company" aria-label="Filter by SPV">
                  <option value="__all">All SPV</option>
                </select>
              </label>
              <label class="ep-filter">
                <span class="ep-filter__label">District</span>
                <select class="ep-filter__select" data-filter="district" aria-label="Filter by district">
                  <option value="__all">All districts</option>
                </select>
              </label>
              <div class="ep-filter ep-filter--date" data-date-filter>
                <span class="ep-filter__label">Range</span>
                <label class="ep-toggle" data-date-toggle title="Toggle date range">
                  <input type="checkbox" />
                  <span class="ep-toggle__track"><span class="ep-toggle__thumb"></span></span>
                </label>
                <div data-date-quick-view>
                  <select class="ep-filter__select ep-filter__select--compact" data-filter="date" aria-label="Date period">
                    <option value="all">All time</option>
                    <option value="today">Today</option>
                    <option value="yesterday">Yesterday</option>
                    <option value="week">This week</option>
                    <option value="month" selected>This month</option>
                  </select>
                </div>
                <div data-date-range-view style="display:none;">
                  <div class="ep-date-range">
                    <label><span>From</span><input class="ep-filter__select ep-filter__select--compact" type="date" data-date-from aria-label="From date" /></label>
                    <span class="ep-date-sep">–</span>
                    <label><span>To</span><input class="ep-filter__select ep-filter__select--compact" type="date" data-date-to aria-label="To date" /></label>
                  </div>
                </div>
              </div>
            </div>

            <!-- Metric cards and the date trend share one panel frame. -->
            <div class="ep-panel">
              <div class="ep-metrics" data-overview-metrics></div>
              <section class="ep-overview-trend" aria-label="Operational trends">
              <p class="ep-overview-trend__status" data-overview-trend-status role="status" aria-live="polite"></p>
              <div class="ep-overview-trend__chart" data-overview-trend-chart>
                <p class="ep-overview-trend__empty">Choose a date range to view a trend.</p>
              </div>
              </section>
            </div>

          </section>

          <!-- ═════════════ PLANTS TABLE (Details pages) ═════════════ -->
          <section class="ep-tab-view" data-tab-view="plants-table">
            <div data-plants-table-host></div>
          </section>

          <!-- ═════════════ PREVENTIVE MAINTENANCE / WASHING CALENDAR ═════════════ -->
          <section class="ep-tab-view" data-tab-view="calendar">
            <div data-calendar-host></div>
          </section>

          <!-- ═════════════ HEALTH / SITE ISSUES ═════════════ -->
          <section class="ep-tab-view" data-tab-view="health">
            <div data-issues-host></div>
          </section>

          <!-- ═════════════ ASSET & WARRANTY ═════════════ -->
          <section class="ep-tab-view" data-tab-view="asset-warranty">
            <div data-asset-warranty-host></div>
          </section>
          <!-- MOVABLE ASSETS -->
<section class="ep-tab-view" data-tab-view="movable-assets">
  <div data-movable-assets-host></div>
</section>

          <!-- ═════════════ PLANT DETAILS (one plant's row) ═════════════ -->
          <section class="ep-tab-view" data-tab-view="plant-details">
            <div data-plant-details-host></div>
          </section>

          <!-- ═════════════ SETTINGS ═════════════ -->
          <section class="ep-tab-view" data-tab-view="settings">
            <div data-settings-host></div>
          </section>

          <!-- ═════════════ PLACEHOLDER (future pages) ═════════════ -->
          <section class="ep-tab-view" data-tab-view="placeholder">
            <div class="ep-panel">
              <div class="ep-placeholder">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--ep-text-faint)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                  <path d="M3 9h18"></path>
                  <path d="M9 21V9"></path>
                </svg>
                <h2 class="ep-placeholder__title" data-placeholder-title>Details</h2>
                <p class="ep-placeholder__context" data-placeholder-context></p>
                <p class="ep-placeholder__message" data-placeholder-subtitle>Page configuration will be added in a future phase.</p>
              </div>
            </div>
          </section>

        </div>
      </div>
    </main>
  </div>

  <!-- ─────────────── Plant catalogue (embedded) ───────────────
       38 plants, snapshotted read-only from scripts/legacy_plants.json.
       Embedded rather than fetched so this prototype opens straight from
       disk with no server, no API and no database. The database stays
       authoritative for the real application in frontend/ + app/. -->
</div>

<!-- ───────────────────────── Sign-in (unchanged) ───────────────────────── -->
<script id="s91-config" type="application/json">{{ {"authProvider": "clerk", "clerkPublishableKey": clerk_publishable_key} | tojson }}</script>
{% if clerk_frontend_api %}
<script defer crossorigin="anonymous" data-clerk-publishable-key="{{ clerk_publishable_key }}" src="https://{{ clerk_frontend_api }}/npm/@clerk/clerk-js@6/dist/clerk.browser.js" type="text/javascript"></script>
{% endif %}
<script>
window.S91_CONFIG = JSON.parse(document.getElementById("s91-config").textContent);
</script>
<script defer src="/static/js/auth-gate.js"></script>

<!-- ───────────────────────── Portal application ───────────────────────── -->
<script defer src="/assets/js/format.js"></script>
<script defer src="/assets/js/portal-api.js"></script>
<script defer src="/assets/js/data-adapter.js"></script>
<script defer src="/assets/js/register-io.js"></script>
<script defer src="/assets/js/plant-details.js"></script>
<script defer src="/assets/js/plants-table.js"></script>
<script defer src="/assets/js/site-issues.js"></script>
<script defer src="/assets/js/asset-warranty.js"></script>
<script defer src="/assets/js/movable-assets.js"></script>
<script defer src="/assets/js/operations-calendar.js"></script>
<script defer src="/assets/js/categories.js"></script>
<script defer src="/assets/js/settings.js"></script>
<script defer src="/assets/js/navigation.js"></script>
<script defer src="/assets/js/overview.js"></script>
<script defer src="/assets/js/app.js"></script>
<script defer src="/static/js/pwa.js"></script>
</body>
</html>
