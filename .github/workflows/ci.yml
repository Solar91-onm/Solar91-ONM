name: Solar91 validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python compilation
        run: python -m compileall -q app scripts
      - name: Install Chromium for browser tests and smoke testing
        run: python -m playwright install --with-deps chromium
      - name: Full API and workflow tests (SQLite test configuration)
        run: python -m pytest -q
      - name: Command Center and Ask Solar91 browser smoke test
        run: python scripts/verify_command_experience.py
      - name: Conflict marker check
        run: |
          if grep -R -n -E '^<<<<<<< |^=======|^>>>>>>> ' app frontend database/migrations --include='*.py' --include='*.js' --include='*.html' --include='*.css' --include='*.sql'; then
            echo 'Unresolved merge markers found' >&2
            exit 1
          fi
