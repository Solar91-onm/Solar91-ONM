name: Storage backup

on:
  schedule:
    - cron: "0 20 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install archive tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gpg tar
      - name: Download and encrypt storage backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET || 'scheduled-om-evidence' }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$SUPABASE_URL"
          printf '::add-mask::%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
          printf '::add-mask::%s\n' "$BACKUP_PASSPHRASE"
          backup_dir="storage-backup"
          archive="solar91-storage.tar.gz"
          encrypted="${archive}.gpg"
          cleanup() {
            rm -rf -- "$backup_dir"
            rm -f -- "$archive"
          }
          trap cleanup EXIT
          python3 scripts/backup_storage.py --output-dir "$backup_dir"
          tar -czf "$archive" -C . "$backup_dir"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 \
            --output "$encrypted" "$archive"
          encrypted_size="$(stat --format=%s "$encrypted")"
          if (( encrypted_size > 450 * 1024 * 1024 )); then
            echo "::error::Encrypted storage backup exceeds 450 MB and cannot fit in the available artifact storage."
            exit 1
          fi
          if (( encrypted_size > 300 * 1024 * 1024 )); then
            echo "::warning::Encrypted storage backup exceeds 300 MB; review available GitHub artifact storage."
          fi
          cleanup
          trap - EXIT
      - name: Upload encrypted storage backup
        uses: actions/upload-artifact@v4
        with:
          name: solar91-storage-backup-${{ github.run_id }}
          path: solar91-storage.tar.gz.gpg
          if-no-files-found: error
          retention-days: 30
