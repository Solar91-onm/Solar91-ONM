name: Database backup

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - name: Read Supabase server version
        id: server
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$SUPABASE_DB_URL"
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          server_version_num="$(psql "$SUPABASE_DB_URL" -X -Atq -c "select current_setting('server_version_num')")"
          if [[ ! "$server_version_num" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read a valid PostgreSQL server version."
            exit 1
          fi
          echo "major=$((server_version_num / 10000))" >> "$GITHUB_OUTPUT"
      - name: Install matching PostgreSQL client from PGDG
        env:
          PG_MAJOR: ${{ steps.server.outputs.major }}
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          source /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes "postgresql-client-${PG_MAJOR}"
          pg_dump --version
      - name: Dump public schema and encrypt it
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$SUPABASE_DB_URL"
          printf '::add-mask::%s\n' "$BACKUP_PASSPHRASE"
          dump_file="solar91-db-$(date +%F).dump"
          pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges -Fc -f "$dump_file"
          dump_size="$(stat --format=%s "$dump_file")"
          if (( dump_size < 1024 )); then
            echo "::error::Database dump is smaller than 1 KB."
            exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 \
            --output "${dump_file}.gpg" "$dump_file"
          rm -- "$dump_file"
      - name: Upload encrypted database backup
        uses: actions/upload-artifact@v4
        with:
          name: solar91-db-backup-${{ github.run_id }}
          path: solar91-db-*.dump.gpg
          if-no-files-found: error
          retention-days: 30
